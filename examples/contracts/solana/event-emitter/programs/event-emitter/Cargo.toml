[package]
name = "event-emitter"
version = "0.1.0"
description = "WAVS Solana fixture program: emits an Anchor event used as a v1 trigger source"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "event_emitter"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
