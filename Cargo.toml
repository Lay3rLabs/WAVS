[workspace]
members = [
    "packages/cli",
    "packages/wavs-mcp",
    "packages/dev-tool",
    "packages/engine",
    "packages/gui/shared",
    "packages/layer-tests",
    "packages/types",
    "packages/utils",
    "packages/version-pins",
    "packages/wavs",
    "examples/components/cosmos-query",
    "examples/components/chain-trigger-lookup",
    "examples/components/echo-data",
    "examples/components/square",
    "examples/components/permissions",
    "examples/components/echo-block-interval",
    "examples/components/echo-cron-interval",
    "examples/components/_helpers",
    "examples/components/_types",
    "examples/components/kv-store",
    "examples/components/simple-aggregator",
    "examples/components/solana-event-relay",
    "examples/components/timer-aggregator",
    "examples/contracts/cosmwasm/trigger/api",
    "examples/contracts/cosmwasm/trigger/simple",
    "examples/contracts/cosmwasm/mock/api",
    "examples/contracts/cosmwasm/mock/service-handler",
    "app/src-tauri",
]
exclude = [
    # Solana fixture program (Anchor) — has its own workspace; built via
    # `anchor build`, not `cargo build --workspace`. See README.
    "examples/contracts/solana/event-emitter",
]
resolver = "2"

[profile.dev]
split-debuginfo = "unpacked"

[profile.test]
split-debuginfo = "unpacked"

[workspace.package]
edition = "2021"
version = "2.8.0"
license = "GPL-3.0-or-later"
authors = ["Layer Labs (Cayman)"]
repository = "https://github.com/Lay3rLabs/WAVS"
rust-version = "1.91.0"

[workspace.dependencies]
# http utilities
axum = { version = "0.8.6", features = ["macros"] }
axum-extra = { version = "0.10.3", features = ["typed-header"] }
http-body-util = "0.1.3"
reqwest = { version = "0.12.23", features = ["json"] }
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
tower = { version = "0.5.2", features = ["util"] }
url = "2.5.7"
cid = "0.11.1"
iri-string = { version = "0.7.8", features = ["serde"] }

# utoipa for OpenAPI
utoipa = { version = "5.4.0", features = ["axum_extras", "macros"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

# error handling and logging
anyhow = "1.0.100"
axum-tracing-opentelemetry = "0.32.0"
opentelemetry = { version = "0.31.0", default-features = false, features = [
    "trace",
] }
opentelemetry-jaeger-propagator = "0.31.0"
opentelemetry-otlp = { version = "0.31.0", default-features = false, features = [
    "trace",
    "grpc-tonic",
    "metrics",
    "http-proto",
    "reqwest-blocking-client",
] }
opentelemetry_sdk = { version = "0.31.0", default-features = false, features = [
    "trace",
    "rt-tokio",
] }
tracing-opentelemetry = { version = "0.32.0", default-features = false, features = [
    "metrics",
] }
thiserror = "2.0.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tracing-log = "0.2"

# cli and config
clap = { version = "4.5.48", features = ["derive", "env", "string"] }
dotenvy = { version = "0.15.7", features = ["cli"] }
dirs = "6.0.0"
shellexpand = "3.1.1"

# async runtime
tokio = { version = "1.47.1", features = ["full"] }
tokio-stream = { version = "0.1" }
futures = "0.3.31"
futures-lite = "1.11.3"
ctrlc = "3.5.0"
temp-env = { version = "0.3.6", features = ["async_closure"] }
async-trait = "0.1.89"
async-stream = "0.3.6"
hypercore = { version = "0.14.0", default-features = false, features = [
    "tokio",
    "replication",
    "sparse",
] }
hyperswarm = { git = "https://github.com/datrs/hyperswarm-rs.git", default-features = false, rev = "da1c2fd" }

# websocket
tokio-tungstenite = { version = "0.28.0", features = [
    "rustls-tls-native-roots",
] }

# collections
dashmap = "6.1.0"
ordermap = "0.5.12"
bimap = { version = "0.6.3", features = ["serde"] }
slotmap = "1.0.7"

# fs
tempfile = "3.23.0"
walkdir = "2.5.0"
wildmatch = "2.5.0"

# EVM-specific dependencies
alloy-node-bindings = "=1.0.42"
alloy-json-abi = "1.4.1"
alloy-primitives = { version = "1.4.1", features = ["serde"] }
alloy-provider = { version = "=1.0.42", features = ["ws", "pubsub"] }
alloy-sol-types = "1.4.1"
alloy-sol-macro = { version = "1.4.1", features = ["json"] }
alloy-transport = "=1.0.42"
alloy-transport-http = "=1.0.42"
alloy-rpc-client = "=1.0.42"
alloy-contract = "=1.0.42"
alloy-signer = "=1.0.42"
alloy-signer-local = { version = "=1.0.42", features = ["mnemonic"] }
alloy-network = "=1.0.42"
alloy-rpc-types-eth = "=1.0.42"

alloy-consensus-any = "=1.0.42"
alloy-consensus = "=1.0.42"
alloy-eips = "=1.0.42"
alloy-network-primitives = "=1.0.42"
alloy-serde = "=1.0.42"
alloy-tx-macros = "=1.0.42"
alloy-eip2930 = "=0.2.1"
alloy-eip7702 = "=0.6.1"
alloy-json-rpc = "=1.6.3"

# Solana-specific dependencies (used by the trigger stream; v1 is
# trigger-only, so we intentionally avoid pulling in the full solana-sdk
# crate constellation - just the pubsub client, RPC client, and the
# Pubkey / commitment primitives we need).
solana-client = "3.1.14"
solana-pubkey = "3"
solana-commitment-config = "3"
solana-rpc-client-api = "3.1.14"
solana-transaction-status-client-types = "3.1.14"

# Slice 3: transaction-construction primitives. Only pulled into the
# layer-tests + integration-test crates so the runtime trigger surface
# stays slim.
solana-keypair = "3.1.2"
solana-signer = "3"
solana-message = "3"
solana-transaction = "3"
solana-instruction = "3"
solana-hash = "4"
solana-sha256-hasher = "3"

layer-climb = "0.9.0"
layer-climb-address = { version = "0.9.0", features = [
    "cw-storage",
    "openapi",
] }
layer-climb-config = "0.9.0"
layer-climb-cli = "0.9.0"

# Cosmos-specific dependencies
cosmwasm-schema = "3.0.2"
cosmwasm-std = { version = "3.0.2", features = ["stargate"] }
cw-storage-plus = "3.0.1"
cw2 = "3.0.0"

# WASM and WIT bindings
wasm-pkg-client = "0.12.0"
wasm-pkg-common = "0.12.0"
wasmtime = { version = "42.0.1", features = [
    "cache",
    "component-model",
    "runtime",
    "std",
] }
wasmtime-wasi = { version = "42.0.1", default-features = true }
wasmtime-wasi-http = "42.0.1"
wasmtime-wasi-tls = "42.0.1"
wit-bindgen = "0.53.1"
wavs-wasi-utils = { path = "packages/wasi-utils" }
wasip2 = "1.0.1"
wstd = "0.6.5"

# benchmarking
criterion = { version = "0.7.0", features = ["async_tokio"] }

# serialization
bincode = { version = "2.0.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
figment = { version = "0.10.19", features = ["toml", "env"] }
toml = "0.9.7"

# randomness
rand = "0.9.2"
getrandom = { version = "0.3", features = ["wasm_js"] }

# pools
deadpool = "0.12.3"

# secrets
bip39 = { version = "2.2.0", features = ["rand"] }

# hashing
sha2 = "0.10.9"
const-hex = "1.16.0"
base64 = "0.22"
bs58 = "0.5.1"
ripemd = "0.1.3"
hypercore-protocol = { version = "0.6.1", default-features = false, features = [
    "tokio",
] }

# database
lru = "0.16.1"

# time
chrono = "0.4.42"
cron = { version = "0.15.0", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v7", "serde"] }
subtle = "2.6.1"
tokio-util = { version = "0.7.17", features = ["compat"] }

# utilis
cfg-if = "1.0.3"
tower-service = "0.3.3"
futures-utils-wasm = "0.1.0"
http = "1.3.1"
regex = "1.11.3"
zeroize = { version = "1.8.2", features = ["derive"] }
derive-enum-all-values = "=0.1.0"
crossbeam = "0.8.4"

# versioning
semver = { version = "1.0.27", features = ["serde"] }

# p2p
# Cargo.toml
libp2p = { version = "0.56", features = [
    "tokio",            # tokio runtime
    "tcp",
    "dns",
    "noise",
    "yamux",
    "identify",
    "ping",
    "gossipsub",
    "request-response",
    "kad",              # WAN discovery
    "mdns",             # local dev discovery
    "autonat",          # NAT detection for external address discovery
    "macros",
    "secp256k1",        # secp256k1 identity for P2P (derived from signing_mnemonic)
] }

# Tauri - backend
tauri = { version = "2.10.2", features = ["protocol-asset"] }
log = "0.4"
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-build = { version = "2.5.3" }
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev="c4c45d503ea115a839aae718d02f79e7c7f0f673"}

# Tauri - frontend
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
wasm-bindgen-futures = "0.4.50"
web-sys = { version = "0.3.77", features = [ "console", "MouseEvent", "HtmlImageElement" ] }
serde-wasm-bindgen = "0.6.5"
gloo-net = {version = "0.6.0", features = ["http"]}
gloo-events = "0.2.0"
gloo-timers = {version = "0.3.0", features = ["futures"]}
tracing-web = "0.1.3"
tracing-panic = "0.1.2"
dominator = "0.5.38"
futures-signals = "0.3.34"
dominator_helpers = "0.8.0"
mime_guess = "2.0.5"
awsm_web = {version = "0.45.0", default-features = false, features = ["dom", "file"]}


# local
utils = { path = "packages/utils" }
wavs = { path = "packages/wavs" }
wavs-engine = { path = "packages/engine" }
wavs-types = { path = "packages/types" }
wavs-cli = { path = "packages/cli" }
wavs-benchmark-common = { path = "packages/wavs/benches/common" }
example-helpers = { path = "examples/components/_helpers" }
example-types = { path = "examples/components/_types" }
cw-wavs-mock-api = { path = "examples/contracts/cosmwasm/mock/api" }
cw-wavs-trigger-api = { path = "examples/contracts/cosmwasm/trigger/api" }
wavs-gui-shared = { path = "packages/gui/shared" }
