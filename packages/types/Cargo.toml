[package]
name = "wavs-types"
description = "WAVS Types"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version = "1.86.0" # required for cosmwasm: https://github.com/CosmWasm/cosmwasm/issues/2485
repository.workspace = true
license.workspace = true
publish = true

[features]
default = ["cosmwasm", "bls"]
full = ["solidity-rpc", "cosmwasm", "signer", "clock", "bls"]
bls = ["dep:commonware-cryptography", "dep:blst", "dep:commonware-codec", "dep:tokio"]
clock = ["dep:chrono"]
signer = ["dep:alloy-signer", "dep:alloy-signer-local"]
solidity-rpc = ["dep:alloy-contract", "dep:alloy-provider"]
cosmwasm = ["dep:cosmwasm-schema"]
ts-bindings = ["dep:ts-rs"]

[[bin]]
name = "ts"
path = "ts.rs"

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
wasm-pkg-common = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
const-hex = { workspace = true }
cosmwasm-std = { workspace = true }
layer-climb-config = { workspace = true }
layer-climb-address = { workspace = true }
bincode = { workspace = true }
ripemd = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
alloy-primitives = { workspace = true }
alloy-sol-macro = { workspace = true }
alloy-sol-types = { workspace = true }
async-trait = { workspace = true }
utoipa = { workspace = true }
semver = { workspace = true }
regex = { workspace = true }
zeroize = { workspace = true }
iri-string = { workspace = true }
cfg-if = { workspace = true }
chrono = { workspace = true, optional = true}
alloy-contract = { workspace = true, optional = true }
alloy-provider = { workspace = true, optional = true }
alloy-signer = { workspace = true, optional = true }
alloy-signer-local = { workspace = true, optional = true }
commonware-cryptography = { workspace = true, optional = true }
blst = { version = "0.3.16", optional = true }
commonware-codec = { version = "2026.3.0", optional = true }
tokio = { version = "1", optional = true, default-features = false, features = ["sync", "rt"] }
cosmwasm-schema = { workspace = true, optional = true }
ts-rs = { version = "11.1", features = ["serde-compat"], optional = true }

[dev-dependencies]
tokio = { workspace = true }
alloy-primitives = { workspace = true }
alloy-provider = { workspace = true }
alloy-signer-local = { workspace = true }
alloy-sol-types = { workspace = true }
rand_chacha = "0.3"
commonware-cryptography = { workspace = true }
commonware-math = "2026.3.0"
