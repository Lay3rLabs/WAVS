[package]
name = "wavs"
description = "WAVS Node Server"
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[features]
default = ["bls"]
bls = []
test-utils = []
dev = []
gui = ["dep:tauri", "wavs-gui-shared/backend"]

[dependencies]
wavs-types = { workspace = true, features = ["full"] }
wavs-engine = { workspace = true }
wavs-gui-shared= { workspace = true}
utils = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
const-hex = { workspace = true }
thiserror = { workspace = true }
dashmap = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tower = { workspace = true }
http-body-util = { workspace = true }
wildmatch = { workspace = true }
layer-climb = { workspace = true }
ctrlc = { workspace = true }
tempfile = { workspace = true }
futures = { workspace = true }
futures-lite = { workspace = true }
cosmwasm-std = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
alloy-contract = { workspace = true }
alloy-primitives = { workspace = true }
alloy-rpc-types-eth = { workspace = true }
alloy-signer-local = { workspace = true }
alloy-provider = { workspace = true, features = ["reqwest", "reqwest-default-tls", "ws", "pubsub"] }
alloy-sol-types = { workspace = true }
wasm-pkg-common = { workspace = true }
chrono = { workspace = true }
cron = { workspace = true }
bincode = { workspace = true }
axum-tracing-opentelemetry = { workspace = true }
opentelemetry = { workspace = true }
tracing-opentelemetry = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
bimap = { workspace = true }
crossbeam = { workspace = true }
iri-string = { workspace = true }
tokio-tungstenite = { workspace = true }
slotmap = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }
bip39 = { workspace = true }
rand_chacha = "0.3"
commonware-p2p = "2026.3.0"
commonware-cryptography = { workspace = true }
commonware-math = "2026.3.0"
commonware-runtime = "2026.3.0"
commonware-utils = "2026.3.0"
commonware-codec = "2026.3.0"
commonware-broadcast = "2026.3.0"
rand_core = "0.6"
hypercore = { workspace = true }
hypercore-protocol = { workspace = true }
hyperswarm = { workspace = true }
tokio-util = { workspace = true }
base64 = { workspace = true }
tauri = {workspace = true, optional = true}

[dev-dependencies]
toml = { workspace = true }
criterion = { workspace = true }
wavs-benchmark-common = { workspace = true }
utils = { workspace = true, features = ["test-utils"] }
example-types = { workspace = true }
alloy-node-bindings = { workspace = true }
commonware-cryptography = { workspace = true }


[[bench]]
name = "intervals"
harness = false
required-features = ["dev"]

[[bench]]
name = "engine_execute"
harness = false
required-features = ["dev"]

[[bench]]
name = "engine_system"
harness = false
required-features = ["dev"]

[[bench]]
name = "dev_triggers"
harness = false
required-features = ["dev"]
