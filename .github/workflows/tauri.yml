name: "tauri"

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # for Arm based macs (M1 and above).
            args: "--target aarch64-apple-darwin"
          - platform: macos-15-intel
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
          run_install: false

      - name: Install frontend dependencies
        run: cd app && pnpm install

      - name: Build Tauri app
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./app"
          includeRelease: false
          args: ${{ matrix.args }}

      - name: Upload artifacts to release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          ARTIFACTS='${{ steps.tauri-build.outputs.artifactPaths }}'

          for artifact in $(echo "$ARTIFACTS" | jq -r '.[]'); do
            if [ ! -f "$artifact" ]; then
              continue
            fi

            filename=$(basename "$artifact")
            # Strip version from filename: WAVS_0.0.1_aarch64.dmg -> WAVS_aarch64.dmg
            renamed=$(echo "$filename" | sed -E 's/_[0-9]+\.[0-9]+\.[0-9]+//')

            cp "$artifact" "/tmp/$renamed"
            gh release upload "$TAG" "/tmp/$renamed" --repo "${{ github.repository }}" --clobber
          done
