name: "Repo setup"
description: "Common CI setup steps (tools, deps, caches, etc.)"

inputs:
  github-token:
    description: "GitHub token for authenticated API requests (avoids rate limits)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install system dependencies (Linux only)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libappindicator3-dev \
          librsvg2-dev \
          patchelf

    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        repo-token: ${{ inputs.github-token }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.91.1
        components: rustfmt, clippy
        targets: wasm32-unknown-unknown

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true

    - name: Install Just
      uses: extractions/setup-just@v2

    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1

    - name: Checkout poa-middleware (bls branch) for BLS e2e tests
      shell: bash
      run: |
        set -euo pipefail
        POA_DIR="${{ runner.workspace }}/contracts/poa-middleware"
        rm -rf "$POA_DIR"
        mkdir -p "$(dirname "$POA_DIR")"
        git clone --depth=1 --branch bls https://github.com/Lay3rLabs/poa-middleware.git "$POA_DIR"
        # OpenZeppelin contracts ship via npm; foundry.toml remaps node_modules.
        npm --prefix "$POA_DIR" ci --no-audit --no-fund

    - name: Create placeholder dist folder for macro expansion
      shell: bash
      run: mkdir -p app/dist
